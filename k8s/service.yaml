apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ecommerce-secure
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 6060
  type: ClusterIP  # SECURITY: Internal only
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ecommerce-secure
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer  # External access

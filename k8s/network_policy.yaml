apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ecommerce-policy
  namespace: ecommerce-secure
spec:
  podSelector: {}  # Apply to all pods in namespace
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ecommerce-secure
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 6060
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ecommerce-secure
  - to:  # Allow external database access
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 27017  # MongoDB

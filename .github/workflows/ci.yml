name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (backend + frontend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            script: "test:backend"
          - name: frontend
            script: "test:frontend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies (needed for frontend tests)
        if: ${{ matrix.name == 'frontend' }}
        run: npm ci --prefix ./client

      - name: Run ${{ matrix.script }}
        run: npm run ${{ matrix.script }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: coverage
          
  e2e-playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }} # Add this secret in GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies (needed for playwright)
        run: npm ci --prefix ./client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 🧠 Optional: seed or initialize your database before tests
      - name: Seed MongoDB test data
        run: node scripts/seed.js
        if: ${{ env.MONGODB_URI != '' }}

      # 🏃 Start your app before running Playwright
      - name: Start app
        run: npm run start:test &
      
      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
